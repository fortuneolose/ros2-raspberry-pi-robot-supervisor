[flake8]
# Match the ROS 2 Jazzy ament_flake8 configuration. Serial execution avoids
# forking flake8 workers from a pytest process that already owns ROS threads.
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
jobs = 1
max-line-length = 99
show-source = true
statistics = true
