name: Model, control, robustness, preflight, and SIM-010 validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/model-tests.yml"
      - "models/**"
      - "tests/**"
      - "data/processed/sim_010_synthetic_validation_report.json"
      - "data/processed/sim_010_synthetic_scenario_trace.csv"
      - "requirements-dev.txt"
  pull_request:
    paths:
      - ".github/workflows/model-tests.yml"
      - "models/**"
      - "tests/**"
      - "data/processed/sim_010_synthetic_validation_report.json"
      - "data/processed/sim_010_synthetic_scenario_trace.csv"
      - "requirements-dev.txt"

permissions:
  contents: read

jobs:
  model-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install model dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run model and control development tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Regenerate synthetic plant evidence
        env:
          MPLCONFIGDIR: .matplotlib
        run: python -m models.validate_model

      - name: Regenerate synthetic control evidence
        env:
          MPLCONFIGDIR: .matplotlib
        run: python -m models.validate_controller

      - name: Regenerate synthetic robustness evidence
        env:
          MPLCONFIGDIR: .matplotlib
        run: python -m models.validate_robustness

      - name: Regenerate pre-fixed-point range evidence
        env:
          MPLCONFIGDIR: .matplotlib
        run: python -m models.validate_range_budget

      - name: Regenerate SIM-010 synthetic SIL evidence
        run: python -m models.validate_sim

      - name: Reject SIM-010 evidence drift
        run: >-
          git diff --exit-code --
          data/processed/sim_010_synthetic_validation_report.json
          data/processed/sim_010_synthetic_scenario_trace.csv
