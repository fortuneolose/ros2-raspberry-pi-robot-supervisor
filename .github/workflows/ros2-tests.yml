name: ROS2-010 Jazzy middleware validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ros2-tests.yml"
      - "models/**"
      - "ros2_ws/**"
      - "scripts/validate_ros2_010.sh"
      - "tests/test_ros2_010_*.py"
      - "data/processed/ros2_010_synthetic_*"
  pull_request:
    paths:
      - ".github/workflows/ros2-tests.yml"
      - "models/**"
      - "ros2_ws/**"
      - "scripts/validate_ros2_010.sh"
      - "tests/test_ros2_010_*.py"
      - "data/processed/ros2_010_synthetic_*"

permissions:
  contents: read

jobs:
  jazzy:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base-noble@sha256:31daab66eef9139933379fb67159449944f4e2dcf2e22c2d12cc715f29873e0f

    steps:
      - name: Install ROS2-010 validation dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            python3-colcon-common-extensions \
            python3-matplotlib \
            python3-numpy \
            python3-pytest \
            python3-scipy \
            ros-jazzy-ament-copyright \
            ros-jazzy-ament-flake8 \
            ros-jazzy-ament-lint-auto \
            ros-jazzy-ament-lint-common \
            ros-jazzy-ament-pep257 \
            ros-jazzy-launch-testing \
            ros-jazzy-launch-testing-ros

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build, test, launch-test, and reject evidence drift
        run: bash scripts/validate_ros2_010.sh
